name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '39 12 * * 5'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: manual  # Changed to manual to support dependency installation

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Fix: Pre-install Node and project dependencies for javascript-typescript target
    - name: Set up Node.js
      if: matrix.language == 'javascript-typescript'
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Fix: Fetch project dependencies so CodeQL can map modern TS declarations / frameworks
    - name: Install dependencies
      if: matrix.language == 'javascript-typescript'
      shell: bash
      run: |
        if [ -f package-lock.json ]; then npm ci;
        elif [ -f yarn.lock ]; then yarn install --frozen-lockfile;
        elif [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile;
        else npm install; fi

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Automatically treats 'manual' as an injection wrapper over our dependency step
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
