name: SonarCloud analysis

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  pull-requests: write # Changed to write so SonarCloud can comment directly on PRs
  contents: read       # Allows checking out public repository files

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your source code files into the runner
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so blame data/lines map correctly

      # Step 2: Run the SonarCloud scan using the updated Java 21 container
      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Added to map analysis metadata
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=arukinSec_frontend
            -Dsonar.organization=arukinsec
            -Dsonar.sources=.
